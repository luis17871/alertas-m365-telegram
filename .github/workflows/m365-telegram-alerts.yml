name: Alertas Microsoft 365 y Azure a Telegram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_post:
        description: 'Enviar un mensaje de prueba al grupo de Telegram'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: m365-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright requests feedparser
          playwright install chromium --with-deps

      - name: Revisar estado y alertar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-5566320217'
          TEST_POST: ${{ inputs.test_post }}
          # Minutos entre recordatorios de un incidente activo (opcional).
          RECORDAR_MIN: '60'
          # Microsoft Graph (opcional): se activan al cargar estos secretos.
          # Requiere app en Entra con ServiceHealth.Read.All y ServiceMessage.Read.All.
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: python check_status.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de alertas M365/Azure"
            git push
          fi
